name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: API — ruff, mypy y pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check app tests
      - name: Ruff format
        run: uv run ruff format --check app tests
      - name: Mypy
        run: uv run mypy app
      - name: Pytest
        run: uv run pytest tests -q

  frontend:
    name: Web — lint, tipos y vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Vitest
        run: npm run test

  # Los E2E de Playwright (14) se ejecutan localmente contra el stack completo;
  # aqui quedarian fuera los servicios (postgres, ntfy...) que consume el e2e.
