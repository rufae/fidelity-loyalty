[project]
name = "localai-fidelity-api"
version = "0.1.0"
description = "API de LocalAI Fidelity — plataforma de fidelización digital y etiquetas NFC/QR"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "argon2-cffi>=23.1,<26",
    "email-validator>=2.2,<3",
    "segno>=1.6,<2",
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
    "ruff>=0.8,<1",
    "mypy>=1.13,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` en valores por defecto es el patrón canónico de FastAPI/Pydantic.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "pydantic.Field",
]

[tool.ruff.lint.per-file-ignores]
# Salidas generadas por Alembic: líneas largas inevitables (create_table, checks).
"migrations/versions/*.py" = ["E501"]
# Plantilla de correo con estilos inline: partir las reglas CSS a 100 columnas
# introduce saltos de línea dentro de los atributos `style` y arriesga el render.
"app/services/email.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]
exclude = ["migrations/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra"
markers = [
    "pg: requiere PostgreSQL real (PG_TEST_URL; docker compose up -d db)",
]
